# CATNAP sim file: operating point and numerics.
kind: catnap-sim
version: 1

time:
  duration_s: 25.0
  steps: 150

tank:
  propellant_mass_kg: 54.0
  temperature_K: 290.0
  vapor_quality: 0.01
  piston_dp_psi: 15.0

environment:
  ambient_pressure_bar: 0.810852  # 0.8 atm; separation criterion is P_exit < 0.4 P_amb

regen:                            # regen + film are solved only at these times
  thermal_model: true             # false: isothermal Darcy-Weisbach channel dP only
  snapshot_times_s: [0.5, 3.4167, 6.3333, 9.25, 12.1667, 15.0833, 18.0]
  coolant_inlet_temperature_K: 290.0
  axial_points: 80

solver:
  chamber_pressure_guess_psi: 340.0
  film_coupling_tol_K: 0.5        # film injection T <-> regen outlet T fixed point
  film_coupling_max_iter: 15

output:
  plots: true
  dashboard: true
  csv: true                       # bundle all plotted data into one CSV .txt in Downloads
